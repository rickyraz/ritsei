# One owner per PostgreSQL schema.
# This registry is consumed by boundary and migration checks.

[schemas]
system = "foundation"
identity = "modules/identity"
party = "modules/party"
auth = "modules/auth"
authorization = "modules/authorization"
sales = "modules/sales"
procurement = "modules/procurement"
inventory = "modules/inventory"
accounting = "modules/accounting"
process = "modules/process"
billing = "modules/billing"
integration = "modules/integrations"
messaging = "modules/messaging"
